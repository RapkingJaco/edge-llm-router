[project]
name = "edge-llm-router"
version = "0.1.0"
description = "RL 智慧 LLM 推論分流器 — 互動展示平台"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 核心 RL / 模擬
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.2",
    # 真實後端 / 網路
    "httpx>=0.27",
    "ollama>=0.3",
    # 服務
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    # 設定 / 追蹤 / 出圖
    "pyyaml>=6",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    # Gemini 雲端後端 / 控制層（可插拔；沒 GEMINI_API_KEY 自動 fallback 回模擬）
    "google-genai>=2.14.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_llm_router"]

# torch 一律走 PyTorch CPU 官方 index：Windows / Linux(CI) 都拿 CPU 版，
# 不會誤抓 CUDA 大包（GPU 只給 Ollama，PPO 小 MLP 用 CPU 足夠）。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
src = ["src", "scripts", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
